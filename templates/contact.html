{% extends 'base.html' %}
{% block content %}
<section class="container" style="margin-top: 50px;">
    <div class="section-title">
        <h2>Contact Us</h2>
        <p>Have questions? Reach out to us or visit our facility.</p>
    </div>
    <div class="grid-3">
        <div class="glass-card" style="grid-column: span 2;">
            <h3>Send a Message</h3>
            <form action="{{ url_for('contact') }}" method="POST" style="margin-top: 20px;">
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" name="name" class="form-control" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" class="form-control" placeholder="Your Email" required>
                    </div>
                </div>
                <div class="form-group">
                    <input type="text" name="subject" class="form-control" placeholder="Subject" required>
                </div>
                <div class="form-group">
                    <textarea name="message" class="form-control" placeholder="Your Message..." required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
        <div class="glass-card text-center">
            <i class="fas fa-map-marked-alt" style="font-size: 3rem; color: var(--accent-red); margin-bottom: 15px;"></i>
            <h3>Location & Info</h3>
            <p style="margin-top: 15px;"><i class="fas fa-map-marker-alt"></i> 123 Health Ave, Medical City</p>
            <p style="margin-top: 10px;"><i class="fas fa-phone"></i> +1 800 123 4567</p>
            <p style="margin-top: 10px;"><i class="fas fa-envelope"></i> info@medhelp.com</p>
            <br>
            <h4 style="color: var(--accent-red);"><i class="fas fa-ambulance"></i> Emergency 24/7</h4>
            <p><strong>911</strong> or <strong>+1 800 999 0000</strong></p>
        </div>
    </div>
</section>
{% endblock %}
