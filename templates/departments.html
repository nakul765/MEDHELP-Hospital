{% extends 'base.html' %}
{% block content %}
<section class="container" style="margin-top: 50px;">
    <div class="section-title">
        <h2>Hospital Departments</h2>
        <p>Explore our specialized departments designed to treat all aspects of human health.</p>
    </div>
    <div class="grid-4">
        {% for dept in departments %}
        <div class="glass-card dept-card text-center">
            <i class="fas {{ dept.icon }}"></i>
            <h3>{{ dept.name }}</h3>
            <p style="font-size: 0.9rem; margin-top: 10px;">{{ dept.desc }}</p>
            <a href="#" class="btn" style="padding: 5px 15px; margin-top: 15px; font-size: 0.8rem;">Read More</a>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
