{% extends 'base.html' %}
{% block content %}
<section class="form-section">
    <div class="glass-card auth-container">
        <div class="section-title" style="margin-bottom: 20px;">
            <h2>Welcome Back</h2>
            <p>Login to manage your appointments.</p>
        </div>
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="position: relative;">
                    <input id="password-field" type="password" name="password" class="form-control" required>
                    <i class="fa fa-eye toggle-password" toggle="#password-field" style="position: absolute; right: 15px; top: 15px; cursor: pointer; color: var(--text-dark);"></i>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 0.9rem;">
                <label><input type="checkbox"> Remember me</label>
                <a href="#" style="color: var(--accent-blue);">Forgot Password?</a>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Login</button>
            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--accent-blue); font-weight: 600;">Sign Up</a>
            </p>
        </form>
    </div>
</section>
{% endblock %}
